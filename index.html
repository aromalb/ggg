<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Morning Star Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: fixed operations sidebar + scrolling work area; right-hand drawer for records, centred modal for messages/payments. */
:root{
  --bg:#F2F4F2; --surface:#FFFFFF; --surface-2:#EBEFEC; --ink:#132220; --muted:#5C6B67; --line:#D9E0DC; --line-2:#C3CDC8;
  --accent:#0C5C58; --accent-ink:#FFFFFF; --accent-soft:#D8EAE6; --brass:#8E6A22; --brass-soft:#F3EAD6;
  --ok:#1E7A4B; --ok-soft:#DCF0E3; --warn:#9A5A06; --warn-soft:#FAEBD3; --bad:#B23A2F; --bad-soft:#F7DFDB; --info:#2C5C9C; --info-soft:#DEE7F5;
  --wa:#178A4C; --wa-ink:#FFFFFF; --brand-bg:#0B3B39; --brand-ink:#E8F1EE; --brand-mute:#9FC0BA; --brand-line:#1E5551; --star:#C9A45C;
  --overlay:rgba(8,24,22,.42); --shadow:0 18px 50px rgba(10,30,28,.18);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1514; --surface:#141E1D; --surface-2:#1B2725; --ink:#E4ECE9; --muted:#93A39F; --line:#26332F; --line-2:#344440;
  --accent:#55B5AB; --accent-ink:#04201D; --accent-soft:#163633; --brass:#D2AE62; --brass-soft:#30281A;
  --ok:#62C793; --ok-soft:#15301F; --warn:#E5A653; --warn-soft:#33270F; --bad:#EC7B70; --bad-soft:#3A1C18; --info:#86ACE6; --info-soft:#1A2A40;
  --wa:#2DBE6C; --wa-ink:#04200F; --brand-bg:#082725; --brand-ink:#E4EFEC; --brand-mute:#8FB3AC; --brand-line:#1A4743; --star:#D2AE62;
  --overlay:rgba(0,0,0,.6); --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#141E1D; --surface-2:#1B2725; --ink:#E4ECE9; --muted:#93A39F; --line:#26332F; --line-2:#344440;
  --accent:#55B5AB; --accent-ink:#04201D; --accent-soft:#163633; --brass:#D2AE62; --brass-soft:#30281A;
  --ok:#62C793; --ok-soft:#15301F; --warn:#E5A653; --warn-soft:#33270F; --bad:#EC7B70; --bad-soft:#3A1C18; --info:#86ACE6; --info-soft:#1A2A40;
  --wa:#2DBE6C; --wa-ink:#04200F; --brand-bg:#082725; --brand-ink:#E4EFEC; --brand-mute:#8FB3AC; --brand-line:#1A4743; --star:#D2AE62;
  --overlay:rgba(0,0,0,.6); --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.65rem} h2{font-size:1.15rem} h3{font-size:.98rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:.5rem .85rem;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);font-size:.9rem;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:.32rem .6rem;font-size:.82rem;border-radius:7px}
.btn.icon{padding:.42rem;}
.btn svg{width:16px;height:16px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.16rem .55rem;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)}
.t-accent{background:var(--accent-soft);color:var(--accent)} .t-muted{background:var(--surface-2);color:var(--muted)}
.t-brass{background:var(--brass-soft);color:var(--brass)}

/* Forms */
.field{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:.55rem .7rem;min-height:38px}
textarea.input{resize:vertical;min-height:80px;line-height:1.5}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem}
.fgrid .full{grid-column:1/-1}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.check{display:flex;align-items:center;gap:.5rem;font-weight:500;font-size:.9rem;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:.85rem;font-weight:600}
@media (max-width:560px){.fgrid,.fgrid.three{grid-template-columns:1fr}}

/* ---------- Login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.brand-pane{background:var(--brand-bg);color:var(--brand-ink);padding-block:44px;padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px;display:flex;flex-direction:column;justify-content:space-between;gap:36px;position:relative;overflow:hidden}
.brand-pane .logo{display:flex;align-items:center;gap:.7rem;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.mark{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--brass);color:var(--brand-bg);flex:none}
.mark svg{width:60%;height:60%}
.wordmark{display:flex;flex-direction:column;line-height:1.05}
.wordmark b{font-family:var(--f-display);font-weight:700;letter-spacing:.01em}
.wordmark small{font-family:var(--f-body);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--star);font-weight:600;margin-top:2px}
.sample-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--brass-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.88rem}
.brand-pane h1{font-size:clamp(1.9rem,3.4vw,2.9rem);line-height:1.08;max-width:15ch}
.brand-pane .lede{color:var(--brand-mute);max-width:44ch;font-size:1rem;margin-top:14px}
.route{position:absolute;right:-40px;top:0;height:100%;width:62%;opacity:.55;pointer-events:none}
.sheet{background:rgba(255,255,255,.05);border:1px solid var(--brand-line);border-radius:12px;padding:6px 0;max-width:420px;position:relative}
.sheet-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--brand-line)}
.sheet-row:first-child{border-top:0}
.sheet-row .mono{color:var(--brass);font-size:.85rem}
.sheet-row small{display:block;color:var(--brand-mute);font-size:.78rem}
.sheet-row .tag{font-size:.72rem;color:var(--brand-mute);border:1px solid var(--brand-line);padding:2px 8px;border-radius:999px}
.form-pane{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));background:var(--bg)}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px}
.login-card h2{font-size:1.6rem}
.pw-wrap{position:relative}
.pw-wrap .btn{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.demo{border:1px dashed var(--line-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.demo-users{display:flex;flex-wrap:wrap;gap:6px}
.otp{font-family:var(--f-mono);font-size:1.5rem;letter-spacing:.5em;text-align:center}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0}
@media (max-width:860px){.login{grid-template-columns:1fr}.brand-pane{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:28px}.brand-pane .sheet,.route{display:none}.form-pane{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* ---------- App shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--brand-bg);color:var(--brand-ink);display:flex;flex-direction:column;gap:18px;padding:20px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:.6rem;padding:2px 8px 8px;font-family:var(--f-display);font-weight:700;line-height:1.15}
.side .logo small{display:block;font-family:var(--f-body);font-weight:500;color:var(--brand-mute);font-size:.74rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;border:0;background:transparent;color:var(--brand-mute);padding:.55rem .7rem;border-radius:8px;cursor:pointer;font-weight:500}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:var(--brand-ink)}
.nav button.on{background:rgba(255,255,255,.1);color:var(--brand-ink);box-shadow:inset 3px 0 0 var(--brass)}
.nav .count{margin-left:auto;background:var(--brass);color:var(--brand-bg);font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:999px}
.side .me{margin-top:auto;border-top:1px solid var(--brand-line);padding:14px 8px 0;display:flex;align-items:center;gap:10px}
.side .me small{display:block;color:var(--brand-mute);font-size:.75rem}
.side .me .btn{margin-left:auto;background:transparent;border-color:var(--brand-line);color:var(--brand-ink)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--accent-soft);color:var(--accent);flex:none}
.side .avatar{background:var(--brand-line);color:var(--brand-ink)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.top .search{position:relative;flex:1;max-width:420px}
.top .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.top .search input{padding-left:34px}
.top .spacer{flex:1}
.menu-btn{display:none}
.content{padding-block:24px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scrim{display:none}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s ease;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .shell.nav-open .side{transform:none}
  .shell.nav-open .scrim{display:block;position:fixed;inset:0;background:var(--overlay);z-index:25}
  .menu-btn{display:inline-flex}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top .hide-sm{display:none}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px 18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}
.kpi{padding:16px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi:first-child{border-left:0}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{color:var(--muted);font-size:.8rem}
.kpi.alert b{color:var(--warn)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}

/* Run sheet */
.run{display:flex;flex-direction:column}
.run-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer}
.run-row:first-child{border-top:0}
.run-row:hover{background:var(--surface-2)}
.run-time{font-family:var(--f-mono);font-size:1rem;font-weight:500}
.run-time small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.run-main{min-width:0}
.run-main b{font-weight:600}
.route-line{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-side{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.run-row.done{opacity:.6}
@media (max-width:640px){.run-row{grid-template-columns:52px minmax(0,1fr)}.run-side{grid-column:2;justify-content:flex-start}}

.att{display:flex;flex-direction:column}
.att-row{display:flex;gap:12px;align-items:flex-start;padding:11px 18px;border-top:1px solid var(--line)}
.att-row:first-child{border-top:0}
.att-row .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.att-row .txt{flex:1;min-width:0;font-size:.9rem}
.att-row .txt small{display:block;color:var(--muted)}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.info{background:var(--info)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

/* Tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl td small{display:block;color:var(--muted);font-size:.8rem}
.tbl .nowrap{white-space:nowrap}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.38rem .75rem;border-radius:7px;font-weight:600;font-size:.85rem;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Dispatch board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 6px;font-weight:700;font-size:.85rem}
.col-h span{color:var(--muted);font-weight:600}
.jcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.jcard:hover{border-color:var(--line-2)}
.jcard .jt{display:flex;justify-content:space-between;align-items:center;gap:6px}
.jcard .jt .mono{font-size:.95rem;font-weight:500}
.jcard .jr{font-size:.82rem;color:var(--muted);line-height:1.35}
.jcard .jf{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.jcard select{font-size:.8rem;padding:.3rem .4rem;min-height:30px}
.jcard.late{box-shadow:inset 3px 0 0 var(--bad)}

/* Cards grid */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--line-2)}
.card-h{display:flex;gap:12px;align-items:center}
.card-h .avatar{width:44px;height:44px;font-size:.95rem}
.card-h div{min-width:0}
.card-h b{display:block;font-size:1rem}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.86rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.hi{background:var(--warn)} .bar i.over{background:var(--bad)}
.plate{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:5px;font-family:var(--f-mono);font-size:.78rem;overflow:hidden;line-height:1;white-space:nowrap}
.plate em{font-style:normal;background:var(--ink);color:var(--bg);padding:4px 5px;font-size:.62rem;display:flex;align-items:center;letter-spacing:.04em}
.plate span{padding:4px 7px}

/* Drawer + modal */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:41;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:flex-start;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--surface)}
.dr-h .t{flex:1;min-width:0}
.dr-b{flex:1;overflow-y:auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:18px}
.dr-f{padding:14px 22px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}

function fixSeedPayments(){ // amounts depend on pricing, fill after seed
 const p=id=>price(S.bookings.find(b=>b.id===id));
 S.payments[0].amount=p('BK-1032').total; S.payments[1].amount=p('BK-1033').total; S.payments[2].amount=r2(p('BK-1045').total/2);
}

/* ================= Pricing ================= */
function price(b){
 const st=S.settings, r=st.rates[b.cls]||{};
 let base;
 if(b.override!==null&&b.override!==''&&!isNaN(b.override))base=Number(b.override);
 else if(b.service==='hourly')base=(r.hourly||0)*Math.max(Number(b.hours)||3,3);
 else base=r[b.service]||0;
 const extras=(b.meet?st.meet:0)+(Number(b.childSeats)||0)*st.childSeat;
 const salik=(Number(b.salikGates)||0)*st.salik;
 const discount=Number(b.discount)||0;
 const subtotal=Math.max(0,base+extras+salik-discount);
 const vat=b.vatOff?0:r2(subtotal*st.vat/100);
 return {base,extras,salik,discount,subtotal:r2(subtotal),vat,total:r2(subtotal+vat),vatOff:!!b.vatOff};
}
const paidOf=id=>r2(S.payments.filter(p=>p.bookingId===id).reduce((s,p)=>s+Number(p.amount||0),0));
function billable(b){return b.status!=='cancelled'}
const balance=b=>billable(b)?r2(price(b).total-paidOf(b.id)):0;
function payState(b){
 if(!billable(b))return ['No charge','muted'];
 const t=price(b).total,p=paidOf(b.id);
 if(p>=t-0.01)return ['Paid','ok'];
 if(p>0)return ['Part paid','warn'];
 if(b.card&&b.card.auth==='Pre-authorised')return ['Card pre-authorised','info'];
 if(b.payMethod==='account')return ['On account','brass'];
 return ['Unpaid','bad'];
}
const qTotals=q=>{const sub=r2(q.items.reduce((s,i)=>s+(Number(i.q)||0)*(Number(i.u)||0),0));const vat=q.vatOff?0:r2(sub*S.settings.vat/100);return{sub,vat,total:r2(sub+vat),vatOff:!!q.vatOff}};
const vatLabel=x=>x.vatOff?'VAT not charged':`VAT ${S.settings.vat}%`;
const vatTag=x=>x.vatOff?' <span class="chip t-muted" style="font-size:.68rem">No VAT</span>':'';

function driverLive(d){
 const live=S.bookings.find(b=>b.driverId===d.id&&b.date===TODAY&&['enroute','onboard'].includes(b.status));
 if(d.status!=='onshift')return {label:DSTAT[d.status][0],tone:DSTAT[d.status][1],job:null};
 if(live)return {label:live.status==='onboard'?'On a trip':'Heading to pickup',tone:'warn',job:live};
 return {label:'Available',tone:'ok',job:null};
}

 const month=TODAY.slice(0,7);

 S.drivers.forEach(d=>DOCS.forEach(([k,l])=>{const s=docState(d[k]);if(s[2]<=30)att.push([s[2]<0?'bad':'warn',`${d.name}: ${l} ${s[2]<0?'expired':'expires in '+s[2]+' days'}`,`Expiry ${fmtDS(d[k])}`,can('drivers')?`<button class="btn sm" data-act="openDriver" data-id="${d.id}">Open</button>`:''])}));
 S.vehicles.forEach(v=>VDOCS.forEach(([k,l])=>{const s=docState(v[k]);if(s[2]<=30)att.push([s[2]<0?'bad':'warn',`${v.model} (${v.plate}): ${l} ${s[2]<0?'expired':'due in '+s[2]+' days'}`,`Renew before ${fmtDS(v[k])}`,can('fleet')?`<button class="btn sm" data-act="nav" data-v="fleet">Fleet</button>`:''])}));
 S.quotes.filter(q=>q.status==='sent').forEach(q=>att.push(['info',`Quote ${q.id} awaiting reply`,`${q.client} · valid until ${fmtD(q.valid)}`,`<button class="btn sm" data-act="openQuote" data-id="${q.id}">Follow up</button>`]));

 if(can('payments'))invs().filter(v=>v.type!=='credit'&&invBalance(v)>0.01&&daysUntil(v.due)<0).forEach(v=>att.push(['bad',`${v.id} is ${-daysUntil(v.due)} days overdue`,`${v.billTo.name} · ${aed(invBalance(v))} unpaid`,`<button class="btn sm" data-act="openInvoice" data-id="${v.id}">Open</button>`]));
 const drivers=S.drivers.map(d=>({d,l:driverLive(d)}));
 return `
 <div class="page-head"><div><h1>${greet}, ${esc(u.name.split(' ')[0])}</h1><p>${live.length} trips on today's run sheet, ${done} completed. ${unassigned.length?`<b style="color:var(--bad)">${unassigned.length} still need a chauffeur.</b>`:'Every upcoming trip has a chauffeur.'}</p></div>
 <div class="actions">${can('quotes')?`<button class="btn" data-act="newQuote">${ic('quotes')}New quote</button>`:''}${can('dispatch')?`<button class="btn" data-act="nav" data-v="dispatch">${ic('dispatch')}Dispatch board</button>`:''}</div></div>
 ${S.sample?`<div class="sample-bar"><span><b>Sample data.</b> Company details and fleet come from morningstarlimo.com; bookings, chauffeurs, clients and rates are examples to try the desk with.</span>${me().role==='admin'?(UI.clearAsk?`<span class="actions"><button class="btn sm" data-act="clearNo">Keep</button><button class="btn sm danger" data-act="clearDo">Yes, clear examples</button></span>`:`<button class="btn sm" data-act="clearAsk">Clear examples, keep fleet</button>`):''}</div>`:''}
 <section class="kpis">
  <div class="kpi"><span class="eyebrow">Trips today</span><b>${live.length}</b><small>${done} done · ${live.filter(b=>['enroute','onboard'].includes(b.status)).length} on the road</small></div>
  <div class="kpi ${unassigned.length?'alert':''}"><span class="eyebrow">Unassigned, next 48h</span><b>${unassigned.length}</b><small>${unassigned[0]?'Next: '+unassigned[0].time+' '+fmtD(unassigned[0].date):'All covered'}</small></div>
  <div class="kpi"><span class="eyebrow">Outstanding</span><b class="num">${aed0(outstanding)}</b><small>Incl. corporate accounts</small></div>
  <div class="kpi"><span class="eyebrow">Revenue this month</span><b class="num">${aed0(monthRev)}</b><small>Completed trips, excl. VAT</small></div>
 </section>
 <div class="grid2">
  <section class="panel"><div class="panel-h"><h2>Today's run sheet</h2><span class="muted">${fmtD(TODAY)}</span></div>
   <div class="run">${today.length?today.map(runRow).join(''):'<p class="empty">No trips today.</p>'}</div></section>
  <div style="display:flex;flex-direction:column;gap:18px;min-width:0">

    <div class="att">${att.length?att.slice(0,9).map(a=>`<div class="att-row"><span class="dot ${a[0]}"></span><div class="txt"><b style="font-weight:600">${esc(a[1])}</b><small>${esc(a[2])}</small></div>${a[3]}</div>`).join(''):'<p class="empty">Nothing waiting on you.</p>'}</div></section>
   <section class="panel"><div class="panel-h"><h2>Chauffeurs</h2>${can('drivers')?`<button class="btn sm ghost" data-act="nav" data-v="drivers">All chauffeurs</button>`:''}</div>
    <div class="att">${drivers.map(({d,l})=>`<div class="att-row" style="align-items:center"><span class="avatar">${initials(d.name)}</span><div class="txt"><b style="font-weight:600">${esc(d.name)}</b><small>${l.job?esc(l.job.id+' · '+l.job.dropoff.split(',')[0]):esc(veh(d.vehicleId)?veh(d.vehicleId).model:'No vehicle')}</small></div>${chip(l.label,l.tone)}</div>`).join('')}</div></section>
  </div>

/* ---------- Bookings ---------- */
function filteredBookings(){
 let list=S.bookings.slice();
 const r=UI.bkRange;
 if(r==='today')list=list.filter(b=>b.date===TODAY);
 else if(r==='tomorrow')list=list.filter(b=>daysUntil(b.date)===1);
 else if(r==='upcoming')list=list.filter(b=>daysUntil(b.date)>=0);
 else if(r==='past')list=list.filter(b=>daysUntil(b.date)<0);
 if(UI.bkStatus!=='all')list=list.filter(b=>b.status===UI.bkStatus);
 const q=UI.q.trim().toLowerCase();
 if(q)list=list.filter(b=>[b.id,b.passenger,b.phone,b.flight,b.pickup,b.dropoff,b.accountId&&acc(b.accountId).name].join(' ').toLowerCase().includes(q));
 return list.sort(r==='past'?(a,b)=>byTime(b,a):byTime);
}
function bkTable(){

 if(!list.length)return `<p class="empty">No bookings match. ${UI.q?'Try a different search, or ':''}<button class="linkbtn" data-act="bkClear">show all bookings</button>.</p>`;
 return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ref</th><th>Pickup time</th><th>Passenger</th><th>Route</th><th>Vehicle</th><th>Chauffeur</th><th class="r">Total</th><th>Payment</th><th>Status</th></tr></thead><tbody>
 ${list.map(b=>{const d=drv(b.driverId),p=payState(b);return `<tr class="click" data-act="openBooking" data-id="${b.id}">
  <td class="nowrap"><span class="mono">${b.id}</span></td>
  <td class="nowrap">${fmtD(b.date)}<small class="mono">${b.time}</small></td>
  <td>${esc(b.passenger)}<small>${b.accountId?esc(acc(b.accountId).name):'Individual'}</small></td>
  <td style="min-width:200px">${esc(b.pickup.split(',')[0])}<small>→ ${esc(b.dropoff.split(',')[0])}</small></td>
  <td class="nowrap">${esc(CLASSES[b.cls])}<small>${esc(SERVICES[b.service])}</small></td>
  <td class="nowrap">${d?esc(d.name):'<span style="color:var(--bad);font-weight:600">Unassigned</span>'}</td>
  <td class="r nowrap num">${aed(price(b).total)}${b.vatOff?'<small>No VAT</small>':''}</td>

const toMin=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
function cardBox(b){

}

function readBookingForm(){

function updatePricePrev(){

function submitBooking(){
 const f=$('#bkForm'),x=readBookingForm(),err=$('#bkErr');
 const miss=[['date','date'],['time','pickup time'],['pickup','pickup address'],['dropoff','drop-off address'],['passenger','passenger name'],['phone','mobile number']].filter(([k])=>!x[k]).map(([,l])=>l);
 if(miss.length){err.hidden=false;err.textContent='Add the '+miss.join(', ')+' to save this booking.';err.scrollIntoView({block:'nearest'});return}
 if(digits(x.phone).length<9){err.hidden=false;err.textContent='The mobile number looks too short. Include the country code, for example +971 50 123 4567.';return}
 const id=f.dataset.id;
 if(id){
  const b=bk(id);const prevDrv=b.driverId;Object.assign(b,x);
  if(x.driverId!==prevDrv){b.vehicleId=x.driverId?drv(x.driverId).vehicleId:'';b.waDriver='';if(x.driverId&&['pending','confirmed'].includes(b.status))b.status='assigned';if(!x.driverId&&b.status==='assigned')b.status='confirmed'}
  logB(b,'Booking edited');save();toast('Changes saved');render();openBooking(id);
 }else{
  S.seq.bk++;const nid='BK-'+S.seq.bk;
  const b=Object.assign({id:nid,status:x.driverId?'assigned':'confirmed',vehicleId:x.driverId?drv(x.driverId).vehicleId:'',card:null,waDriver:'',waClient:'',created:nowStamp(),log:[]},x);
  logB(b,'Booking created');S.bookings.push(b);
  if(UI.fromQuote){const q=qt(UI.fromQuote);if(q){q.status='accepted';q.bookingId=nid}UI.fromQuote=null}
  save();toast(nid+' created');render();openBooking(nid);
 }
}

   ${['cancelled','noshow'].includes(b.status)?statusChip(b.status):b.status==='completed'?'':nxt?`<button class="btn sm" data-act="advance" data-id="${b.id}" data-stop="1">${nxt[1]} ›</button>`:''}</div>

 </div>`).join('')}</div>

const QST={draft:['Draft','muted'],sent:['Sent','info'],accepted:['Accepted','ok'],declined:['Declined','bad'],expired:['Expired','warn']};
function vQuotes(){
 S.quotes.forEach(q=>{if(q.status==='sent'&&daysUntil(q.valid)<0)q.status='expired'});
 let list=S.quotes.slice().sort((a,b)=>b.date.localeCompare(a.date));
 if(UI.qFilter!=='all')list=list.filter(q=>q.status===UI.qFilter);
 const open=S.quotes.filter(q=>['draft','sent'].includes(q.status));

 return `<div class="page-head"><div><h1>Quotes</h1><p>${open.length} open worth ${aed0(open.reduce((s,q)=>s+qTotals(q).total,0))} · ${decided?Math.round(won/decided*100):0}% win rate</p></div>

 </form>

function readQItems(){return [...document.querySelectorAll('#qItems .qrow')].map(r=>({d:r.querySelector('[name=qd]').value.trim(),q:Number(r.querySelector('[name=qq]').value)||0,u:Number(r.querySelector('[name=qu]').value)||0})).filter(i=>i.d||i.u)}
function updateQTot(){const el=$('#qTot');if(!el)return;const t=qTotals({items:readQItems(),vatOff:!$('#q_vat')?.checked});el.innerHTML=`<table class="price"><tr><td class="muted">Subtotal</td><td>${aed(t.sub)}</td></tr><tr><td class="muted">${vatLabel(t)}</td><td>${aed(t.vat)}</td></tr><tr class="tot"><td>Total</td><td>${aed(t.total)}</td></tr></table>`}
function submitQuote(){
 const f=$('#qForm'),fd=new FormData(f),items=readQItems(),err=$('#qErr');
 const x={accountId:fd.get('accountId'),client:fd.get('client').trim(),phone:fd.get('phone').trim(),email:fd.get('email').trim(),valid:fd.get('valid'),notes:fd.get('notes').trim(),items,vatOff:!fd.get('vatOn')};
 if(!x.client||!x.phone){err.hidden=false;err.textContent='Add the client name and WhatsApp number.';return}
 if(!items.length){err.hidden=false;err.textContent='Add at least one priced line.';return}
 const id=f.dataset.id;
 if(id){Object.assign(qt(id),x);save();render();openQuote(id);toast('Quote saved')}
 else{S.seq.qt++;const nid='QT-'+S.seq.qt;S.quotes.push(Object.assign({id:nid,date:TODAY,status:'draft',bookingId:'',sentAt:''},x));save();render();openQuote(nid);toast(nid+' saved as draft')}
}

function aiInline(t){
 return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\b((?:BK|QT)-\d{3,6})\b/g,(m,r)=>(r.startsWith('BK')?bk(r):qt(r)&&can('quotes'))?`<button class="ref" data-act="aiRef" data-id="${r}">${r}</button>`:r);
}
function aiMd(text){
 const lines=esc(text).split('\n');let out='',list=false,draft=null;
 const close=()=>{if(list){out+='</ul>';list=false}};
 for(const raw of lines){
  const l=raw.trimEnd();
  if(draft!==null){draft.push(raw);continue}
  if(/^\s*(\*\*)?Draft:?(\*\*)?\s*$/i.test(l)){close();out+='<p><b>Draft</b></p>';draft=[];continue}
  const m=l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
  if(m){if(!list){out+='<ul>';list=true}out+='<li>'+aiInline(m[1])+'</li>';continue}
  close();
  if(!l.trim())continue;
  const h=l.match(/^#{1,4}\s+(.*)/);
  out+='<p>'+(h?'<b>'+aiInline(h[1])+'</b>':aiInline(l))+'</p>';
 }
 close();
 if(draft!==null)out+=`<div class="draft">${draft.join('\n').trim()}</div>`;
 return out;
}

async function aiSend(q){
 q=String(q||'').trim();if(!q||UI.ai.busy||!SAMPLE)return;
 const inp=$('#aiInput');if(inp)inp.value='';
 // Never send card numbers to the model
 if(/\b(?:\d[ -]?){13,19}\b/.test(q)&&/\d{4}[ -]?\d{4}[ -]?\d{4}/.test(q)){
  UI.ai.turns.push({role:'user',content:q.replace(/\d[\d -]{11,}\d/g,'•••• (removed)')});
  UI.ai.turns.push({role:'assistant',kind:'err',shown:'That looks like a card number, so I did not send it. Never paste full card numbers here. Record only the last 4 digits with Confirm card details on the booking.',content:'(message withheld)'});
  renderAI();return;
 }
 UI.ai.turns.push({role:'user',content:q});
 const ctl=new AbortController();UI.ai.ctl=ctl;UI.ai.busy=true;UI.ai.live='';renderAI();
 const hist=UI.ai.turns.filter(m=>m.kind!=='err').slice(-12).map(m=>({role:m.role,content:m.role==='assistant'&&m.kind==='oos'?'That request is outside my scope.':m.content}));
 try{
  const {text,truncated}=await SAMPLE([{role:'user',content:aiRules()},...hist],{cache:false,signal:ctl.signal,onText:({text})=>{UI.ai.live=text;aiLiveUpdate()}});
  if(text.trim().startsWith(OOS))UI.ai.turns.push({role:'assistant',kind:'oos',shown:oosMsg(),content:OOS});
  else UI.ai.turns.push({role:'assistant',content:text+(truncated?'\n\n(Answer cut short. Ask for less at a time.)':'')});
 }catch(e){
  const part=e&&e.text&&!isOOSPrefix(e.text)?e.text:'';
  const msg={cancelled:null,rate_limited:'Too many questions in a short time, or your Claude usage limit is reached. Wait a moment and ask again.',session_expired:'Your Claude session expired. Sign in to Claude again, then ask.',refused:'The assistant could not answer that. Try asking it differently.',prompt_too_large:'There is too much data to send at once. Ask about a shorter date range.',empty_completion:'No answer came back. Try rephrasing.'}[e&&e.code];
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e&&e.code)){AI_STATE='absent';UI.ai.turns.push({role:'assistant',kind:'err',shown:'The assistant is turned off for this view. Allow Claude for this page in its permissions to use it.',content:''})}
  else if(e&&e.code==='cancelled'){if(part)UI.ai.turns.push({role:'assistant',content:part,stopped:true});else UI.ai.turns.pop()}
  else{if(part)UI.ai.turns.push({role:'assistant',content:part,stopped:true});UI.ai.turns.push({role:'assistant',kind:'err',shown:msg||'The connection dropped before the answer finished. Ask again.',content:''})}
 }finally{UI.ai.busy=false;UI.ai.live='';UI.ai.ctl=null;renderAI();setTimeout(()=>$('#aiInput')?.focus(),20)}
}

/* ================= Invoicing ================= */
async function nextNo(kind){const pre={bk:'BK-',qt:'QT-',py:'PY-',inv:'INV-',cn:'CN-'}[kind],pool={bk:S.bookings,qt:S.quotes,py:S.payments,inv:invs(),cn:invs()}[kind];S.seq=S.seq||{};const mx=Math.max(S.seq[kind]||1000,...pool.filter(x=>String(x.id).startsWith(pre)).map(x=>Number(String(x.id).slice(pre.length))||0));S.seq[kind]=mx+1;return S.seq[kind]}
const invs=()=>S.invoices||(S.invoices=[]);
const inv=id=>invs().find(x=>x.id===id);
UI.invFilter=UI.invFilter||'open';UI.tiAll=false;UI.iRate=null;
const lineNet=l=>r2((Number(l.q)||0)*(Number(l.u)||0));
function invTotals(v){const rate=v.vatRate??S.settings.vat;let net=0,vat=0;(v.lines||[]).forEach(l=>{const n=lineNet(l);net+=n;if(l.vat!==false)vat+=r2(n*rate/100)});net=r2(net);vat=r2(vat);return{net,vat,total:r2(net+vat),rate}}
const invPays=v=>S.payments.filter(p=>p.invoiceId===v.id||(!p.invoiceId&&p.bookingId&&(v.bookingIds||[]).includes(p.bookingId)));
const invPaid=v=>r2(invPays(v).reduce((s,p)=>s+Number(p.amount||0),0));
const invCredits=v=>r2(invs().filter(c=>c.type==='credit'&&c.creditFor===v.id).reduce((s,c)=>s+invTotals(c).total,0));
const invBalance=v=>v.type==='credit'?0:r2(invTotals(v).total-invPaid(v)-invCredits(v));
function invState(v){
 if(v.type==='credit')return['Credit note','info'];
 const t=invTotals(v).total,bal=invBalance(v),cr=invCredits(v);
 if(bal<=0.01)return[cr>=t-0.01?'Credited':'Paid','ok'];
 const n=daysUntil(v.due);
 if(n<0)return[`Overdue ${-n} day${n===-1?'':'s'}`,'bad'];
 if(invPaid(v)>0||cr>0)return['Part paid','warn'];
 return[n===0?'Due today':`Due in ${n} day${n===1?'':'s'}`,n<=3?'warn':'accent'];
}

const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return ymd(x)};

function groupPayments(list){const m=new Map();list.forEach(p=>{const k=p.batch||p.id;const g=m.get(k)||{id:k,date:p.date,amount:0,method:p.method,ref:p.ref||'',invoiceId:p.invoiceId||'',bookingIds:[]};g.amount=r2(g.amount+Number(p.amount||0));if(p.bookingId&&!g.bookingIds.includes(p.bookingId))g.bookingIds.push(p.bookingId);if(p.invoiceId)g.invoiceId=p.invoiceId;m.set(k,g)});return [...m.values()].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id))}

/* amount in words, as UAE invoices usually show */
function words(n){
 const a=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
 const h=x=>x<20?a[x]:x<100?t[Math.floor(x/10)]+(x%10?'-'+a[x%10]:''):a[Math.floor(x/100)]+' hundred'+(x%100?' and '+h(x%100):'');
 let r=Math.floor(n);if(!r)return'zero';const out=[];
 for(const [v,l] of [[1e9,'billion'],[1e6,'million'],[1e3,'thousand']]){if(r>=v){out.push(h(Math.floor(r/v))+' '+l);r%=v}}
 if(r)out.push((out.length&&r<100?'and ':'')+h(r));return out.join(' ');
}

async function invPay(id){
 if(UI.saving)return;
 const v=inv(id),fd=new FormData($('#ipForm')),err=$('#ipErr'),E=m=>{err.hidden=false;err.textContent=m};
 const amt=r2(Number(fd.get('amount'))),bal=invBalance(v);
 if(!(amt>0))return E('Enter an amount above zero.');
 if(amt>bal+0.01)return E(`That is more than the balance of ${aed(bal)}.`);
 const date=String(fd.get('date')||TODAY),method=String(fd.get('method')),ref=String(fd.get('ref')||'').trim();
 UI.saving=true;let batch=null;const made=[];
 try{
  const add=async(bookingId,a)=>{const no=await nextNo('py');const p={id:'PY-'+no,bookingId,invoiceId:v.id,date,amount:r2(a),method,ref};if(!batch)batch=p.id;p.batch=batch;made.push(p)};
  let rest=amt;
  for(const bid of v.bookingIds||[]){const b=bk(bid);if(!b||rest<=0.01)continue;const bb=balance(b);if(bb>0.01){const a=Math.min(bb,rest);await add(bid,a);rest=r2(rest-a)}}
  if(rest>0.01)await add('',rest);
 }catch(e){return E(e.message)}finally{UI.saving=false}
 made.forEach(p=>{S.payments.push(p);const b=p.bookingId&&bk(p.bookingId);if(b)logB(b,`Payment ${aed(p.amount)} received on ${v.id}`)});
 save();closeModal();render();openInvoice(v.id);toast('Payment recorded. Receipt '+batch+' is ready.');
}

@media (max-width:560px){.irow{grid-template-columns:64px minmax(0,1fr) auto 30px}.irow>input:first-child{grid-column:1/-1}}
</style>`);


document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.matches('.jcard,.run-row,tr.click,.card,.log div')&&e.target.closest('button,select,a')&&e.target.closest('button,select,a')!==el)return;
 const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,e)}
});
document.addEventListener('change',e=>{
 const el=e.target;const k=el.dataset.change;
 if(k==='bkStatus'){UI.bkStatus=el.value;$('#bkTable').innerHTML=bkTable()}
 else if(k==='quickAssign'&&el.value){const b=bk(el.dataset.id);b.driverId=el.value;b.vehicleId=drv(el.value).vehicleId;if(['pending','confirmed'].includes(b.status))b.status='assigned';logB(b,'Assigned to '+drv(el.value).name);save();render();toast(b.id+' assigned to '+drv(el.value).name.split(' ')[0])}
 else if(k==='drvStatus'){const d=drv(el.dataset.id);d.status=el.value;save();render();openDriver(d.id);toast(d.name.split(' ')[0]+' is now '+DSTAT[d.status][0].toLowerCase())}
 if(el.closest('#bkForm')){if(el.name==='accountId'){const a=acc(el.value);$('#f_vat').checked=!(a&&a.vatOff);if(a&&a.vatOff&&!$('#f_vatnote').value)$('#f_vatnote').value=a.vatNote||''}updatePricePrev()}
 if(el.closest('#qForm')&&el.name==='accountId'){const a=acc(el.value);$('#q_vat').checked=!(a&&a.vatOff);updateQTot()}
 if(k==='qVatQuick'){const q=qt(el.dataset.id);q.vatOff=!el.checked;save();render();openQuote(q.id);toast(q.vatOff?'VAT removed from quote':'VAT added to quote')}
 if(k==='vatQuick'){const b=bk(el.dataset.id);b.vatOff=!el.checked;if(b.vatOff&&!b.vatNote&&b.accountId&&acc(b.accountId)?.vatNote)b.vatNote=acc(b.accountId).vatNote;if(!b.vatOff)b.vatNote='';logB(b,b.vatOff?'VAT removed from this booking':'VAT added to this booking');save();render();openBooking(b.id);toast(b.vatOff?'VAT removed. New total '+aed(price(b).total):'VAT added. New total '+aed(price(b).total))}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.closest('#bkForm'))updatePricePrev();
 if(el.closest('#qForm'))updateQTot();
 if(el.id==='waText'||el.id==='waPhone')updateWaLink();
 if(el.id==='aiInput'){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px'}
 if(el.id==='bkq'){UI.q=el.value;$('#bkTable').innerHTML=bkTable();const g=$('#gsearch');if(g)g.value=el.value}
 if(el.id==='c_e'&&/^\d{2}$/.test(el.value)&&e.inputType!=='deleteContentBackward')el.value+='/';
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else if(UI.drawer||$('#drawer').classList.contains('on'))closeDrawer();else if(UI.ai.open){UI.ai.open=false;renderAI()}}
 if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='aiInput'){e.preventDefault();aiSend(e.target.value);return}
 if(e.key==='Enter'&&e.target.id==='gsearch'){UI.q=e.target.value.trim();UI.view='bookings';UI.bkRange='all';UI.bkStatus='all';render();const r=filteredBookings();if(r.length===1)openBooking(r[0].id)}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,k=f.dataset.form;
 if(k==='login'){const fd=new FormData(f),em=(fd.get('email')||'').trim().toLowerCase(),pw=fd.get('password')||'';
  if(!em||!pw){UI.loginErr='Enter your work email and password.';render();return}
  const u=S.users.find(x=>x.email.toLowerCase()===em);
  if(!u||pw!=='demo1234'){UI.loginErr='That email and password do not match. Check for typos, or reset your password.';render();$('#lemail').value=em;return}
  UI.pending=u.id;UI.login='otp';UI.loginErr='';render();setTimeout(()=>$('#otp')?.focus(),30)}
 else if(k==='otp'){const v=new FormData(f).get('otp').trim();if(v!=='482913'){UI.loginErr='That code is not right. Check the latest WhatsApp message and try again.';render();return}S.session=UI.pending;UI.pending=null;UI.login='login';UI.loginErr='';UI.view='dashboard';save();render()}
 else if(k==='forgot'){const em=(new FormData(f).get('email')||'').trim();if(!/^\S+@\S+\.\S+$/.test(em)){UI.loginErr='Enter a valid email address.';render();return}UI.loginErr='If an account exists for '+em+', a reset link is on its way. Check your inbox and spam folder.';render()}
 else if(k==='booking')submitBooking();
 else if(k==='quote')submitQuote();
 else if(k==='pay')A.submitPay();
 else if(k==='card')A.submitCard();
});

load();
const h=(location.hash||'').slice(1);if(ACCESS.admin.includes(h))UI.view=h;
render();
</script>
</body>
